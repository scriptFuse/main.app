<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="translation.js"></script>
    <script type="module" src="firebase.js"></script>
    <title>ScriptFuse</title>
    

    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<main class="page page-home">
    <section class="card text-center">
        <div class="lang-box">
            <button type="button" id="lang-toggle" class="lang-btn">EN / FR</button>
        </div>
        <h1>ScriptFuse</h1>
        <p data-key="Slogan"></p>
        <br>
        <p data-key="accountCreation"></p>
        <section class="card text-center">
            <form id="accountCreationForm">
                <label for="firstName" data-key="firstName">Name</label>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
                <br>
                <br>
                <label for="lastName" data-key="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
                <br>
                <br>
                <label for="emailAddress" data-key="emailAddress">emailAddress</label>
                <input type="email" id="emailAddress" name="emailAddress" autocomplete="email" required>
                <br>
                <br>
                <label for="passWord" data-key="passWord">Password</label>
                <input type="password" id="passWord" name="passWord" autocomplete="new-password" minlength="6" required>
                <br>
                <br>
                <label for="ConfirmPW" data-key="ConfirmPW">Confirm password</label>
                <input type="password" id="ConfirmPW" name="ConfirmPW" autocomplete="new-password" minlength="6" required>
                <p id="accountCreationStatus" role="status" aria-live="polite"></p>
                <button data-key="createAccnt" id="createAccntBtn" class="button" type="submit">Create account</button>
            </form>
            <p data-key="haveAccount">Already have an account?</p>
            <a data-key="loginLink" href="login.html">Log in</a>
        </section>
    </section>
</main>
</body>
</html>
