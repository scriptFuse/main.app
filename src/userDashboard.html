<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="translation.js?v=5"></script>
    <script type="module" src="firebase.js?v=7"></script>
    <title>ScriptFuse</title>
    

    <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
<main class="page page-User Dashboard">
    <section class="card text-center">
        <div class="page-header">
            <div class="lang-box">
                <button type="button" id="lang-toggle" class="lang-btn">EN / FR</button>
            </div>
        </div>
        <h1>ScriptFuse</h1>
        <p data-key="Slogan"></p>
        <br>
        
        <section class="card text-center">
            <p><span data-key="hi"></span><span id="dashboardUserName"></span><span id="dashboardUserRole" class="dashboard-role" hidden></span></p>
        
            <br>
            <a data-key="newOrder" id="newOrder" class="btn btn-primary" href="newOrder.html">New order</a>
            <br><br>
            <a data-key="currentOrders" id="currentOrders" class="btn btn-primary" href="currentOrders.html">Current orders</a>
            <br><br>
            <a data-key="requestedInfo" id="requestedInfo" class="btn btn-primary" href="requestedInfo.html">Requested info</a>
            <br><br>
            <a data-key="pastOrders" id="pastOrders" class="btn btn-primary" href="pastOrders.html">Past orders</a>
            <br><br>
            <button type="button" id="editProfileBtn" class="button-secondary" data-key="editProfile">Edit profile</button>


        </section>
        <br><br>
        <button id="logoutBtn" type="button" data-key="logout"></button>

    </section>

</main>

<dialog id="profileDialog" class="profile-dialog" aria-labelledby="profileDialogTitle">
    <form id="profileForm">
        <button type="button" id="closeProfileDialogX" class="profile-dialog-close" aria-label="Close" title="Close">X</button>
        <h2 id="profileDialogTitle" data-key="editProfile">Edit profile</h2>
        <label for="profileName" data-key="profileName">Name</label>
        <input id="profileName" name="name" type="text" autocomplete="name" required>

        <label for="profileEmail" data-key="profileEmail">Email address</label>
        <input id="profileEmail" name="email" type="email" autocomplete="email" required>

        <p class="form-help" data-key="profileCredentialHelp">Enter your current password to change your email or password.</p>
        <label for="profileCurrentPassword" data-key="profileCurrentPassword">Current password</label>
        <input id="profileCurrentPassword" name="currentPassword" type="password" autocomplete="current-password">

        <label for="profileNewPassword" data-key="profileNewPassword">New password (optional)</label>
        <input id="profileNewPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6">

        <label for="profileConfirmPassword" data-key="profileConfirmPassword">Confirm new password</label>
        <input id="profileConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6">

        <p id="profileStatus" role="status" aria-live="polite" hidden></p>
        <div class="profile-dialog-actions">
            <button type="button" id="closeProfileDialog" class="button-secondary" data-key="cancel">Cancel</button>
            <button type="submit" id="saveProfileBtn" data-key="saveChanges">Save changes</button>
        </div>
    </form>
</dialog>
</body>
</html>
